<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sorveteria Delicia - Entrar</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

   <header class="cabecalho-principal">
        <div class="logo">
            <h1>Sorveteria</h1>
        </div>

        <nav>

            <ul class="menu-navegacao">
                <li><a href="index.html" class="link-inicial">Início</a></li>
                <li><a href="login.html">Entrar</a></li>
            </ul>
        </nav>

    </header>


    <main class="conteudo">
        <section class="secao-login">
            <h2>Entrar na sua conta</h2>
            <p>Acesse para acompanhar seus pedidos e aproveitar nossas novidades.</p>

            <form action="#" method="post" class="formulario-login">
                <div class="campo">
                    <label for="email">E-mail</label>
                    <input type="email" id="email" name="email" placeholder="seuemail@exemplo.com" required>
                </div>

                <div class="campo">
                    <label for="senha">Senha</label>
                    <input type="password" id="senha" name="senha" placeholder="Digite sua senha" required>
                </div>

                <div class="campo-checkbox">
                    <input type="checkbox" id="lembrar" name="lembrar">
                    <label for="lembrar">Lembrar de mim</label>
                </div>

                <button type="submit" class="botao-entrar">Entrar</button>

                <p class="links-extras">
                    <a href="#">Esqueci minha senha</a> |
                    <a href="#">Criar uma conta</a>
                </p>
            </form>
        </section>
    </main>

    <footer class="rodape">
        <p>&copy; 2026 Sorveteria Delicia.</p>
        <p>Desenvolvido: <a href="" target="_blank" rel="noopener noreferrer">Iasmim Fernandes.</a></p>
    </footer>

</body>
</html>
